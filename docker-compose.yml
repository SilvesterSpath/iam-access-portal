services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: access_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/access_portal?schema=public
      DB_HOST: db
      DB_PORT: '5432'
      PORT: '3000'
      NODE_OPTIONS: --experimental-require-module
    ports:
      - '3000:3000'
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pgdata:
