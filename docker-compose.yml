services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: access_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/access_portal?schema=public
      DB_HOST: db
      DB_PORT: '5432'
      PORT: '3000'
      NODE_OPTIONS: --experimental-require-module
    ports:
      - '3000:3000'
    depends_on:
      - db
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
